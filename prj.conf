# Базовые настройки
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y

# Рандом для эмуляции физики
CONFIG_TEST=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_IRQ_OFFLOAD=y

# Замедляем симулятор
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# --- Zephyr Shell и UART ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_PRINTF_BUFF_SIZE=128
CONFIG_SHELL_HISTORY_BUFFER=64

# Консоль и UART
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Драйвер PTY UART для native_sim
CONFIG_UART_NATIVE_PTY=y
# Самая важная строка: подключаем UART к stdin/stdout терминала
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# --- Сеть (закомментирована, так как TCP пока не нужен) ---
# CONFIG_NETWORKING=y
# CONFIG_NET_TCP=y
# CONFIG_NET_IPV4=y
# CONFIG_NET_SOCKETS=y
# CONFIG_NET_L2_ETHERNET=y
