name: Zephyr QEMU demo

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      QEMU_BIN_PATH: /usr/bin
      ZEPHYR_BASE: ${{ github.workspace }}/../zephyr-workspace/zephyr
    steps:
      - uses: actions/checkout@v5

      - name: Установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git python3-venv python3-dev \
            cmake ninja-build gperf device-tree-compiler make curl xz-utils qemu-system-arm
          python3 -m venv "$RUNNER_TEMP/zephyr-venv"
          "$RUNNER_TEMP/zephyr-venv/bin/pip" install west
          echo "$RUNNER_TEMP/zephyr-venv/bin" >> "$GITHUB_PATH"

      - name: Установить ARM toolchain
        run: |
          bash scripts/install_sdk.sh "$RUNNER_TEMP"
          echo "ZEPHYR_SDK_INSTALL_DIR=$RUNNER_TEMP/zephyr-sdk-1.0.1" >> "$GITHUB_ENV"

      - name: Подготовить Zephyr
        working-directory: ${{ github.workspace }}/..
        run: |
          git init zephyr-workspace/zephyr
          git -C zephyr-workspace/zephyr remote add origin https://github.com/zephyrproject-rtos/zephyr
          git -C zephyr-workspace/zephyr fetch --depth 1 origin 6848730b4b3f4d6e9151a0a8873955878be1a18d
          git -C zephyr-workspace/zephyr checkout --detach FETCH_HEAD
          west init -l zephyr-workspace/zephyr
          cd zephyr-workspace
          west update cmsis cmsis_6 hal_nordic
          python -m pip install -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt

      - name: Проверить трассируемость требований
        run: python scripts/check_traceability.py

      - name: Собрать приложение
        run: west build -b qemu_cortex_m3 -d build . -o=-j4

      - name: Проверить логику и аварийный сценарий в QEMU
        run: python "$ZEPHYR_BASE/scripts/twister" -T tests -p qemu_cortex_m3 -O twister-out -j 4

      - name: Проверить команды Shell в QEMU
        run: python scripts/demo_test.py --elf build/zephyr/zephyr.elf

      - name: Проверить Modbus RTU на втором UART QEMU
        run: python -m scripts.test_modbus --elf build/zephyr/zephyr.elf

      - name: Проверить валидатор YAML
        run: python -m unittest discover -s tests/host -p 'test_*.py'

      - name: Выполнить YAML-сценарии и перезапуски NVS
        run: python -m scripts.run_scenarios --elf build/zephyr/zephyr.elf

      - name: Выполнить YAML-сценарий чтения Modbus
        run: |
          python -m scripts.run_scenarios --file scenarios/modbus_read_state.yaml \
            --elf build/zephyr/zephyr.elf --log build/modbus-scenario.log

      - name: Проверить атомарность FC16 через YAML
        run: |
          python -m scripts.run_scenarios --file scenarios/modbus_atomic_write.yaml \
            --elf build/zephyr/zephyr.elf --log build/modbus-atomic.log

      - name: Проверить параметры двигателя через Modbus
        run: |
          python -m scripts.run_scenarios --file scenarios/modbus_motor_parameters.yaml \
            --elf build/zephyr/zephyr.elf --log build/modbus-motor.log

      - name: Проверить атомарную запись motor_data и NVS через Modbus
        run: |
          python -m scripts.run_scenarios --file scenarios/modbus_motor_data.yaml \
            --elf build/zephyr/zephyr.elf --log build/modbus-motor-data.log

      - name: Проверить моторные защиты и пересчёт порогов
        run: |
          python -m scripts.run_scenarios --file scenarios/motor_protections.yaml \
            --elf build/zephyr/zephyr.elf --log build/motor-protections.log

      - name: Проверить Shell-настройку двигателя
        run: |
          python -m scripts.run_scenarios --file scenarios/motor_shell.yaml \
            --elf build/zephyr/zephyr.elf --log build/motor-shell.log

      - name: Проверить допустимый и несовместимый паспорт двигателя
        run: |
          python -m scripts.run_scenarios --file tests/conformance/scenarios/motor_config_valid.yaml \
            --elf build/zephyr/zephyr.elf --log build/motor-config-valid.log
          python -m scripts.run_scenarios --file tests/conformance/scenarios/motor_config_invalid.yaml \
            --elf build/zephyr/zephyr.elf --log build/motor-config-invalid.log

      - name: Проверить отказ и повреждение flash
        run: python -m scripts.test_storage --elf build/zephyr/zephyr.elf

      - name: Проверить сборку аппаратного ADC для nRF52840 DK
        run: west build -b nrf52840dk/nrf52840 -d build-hw . -o=-j4

      - name: Проверить сборку ADC и Modbus для nRF52840 DK
        run: |
          west build -b nrf52840dk/nrf52840 -d build-hw-modbus . -o=-j4 -- \
            -DEXTRA_CONF_FILE=config/modbus.conf \
            -DEXTRA_DTC_OVERLAY_FILE=boards/nrf52840dk_modbus.overlay

      - name: Собрать аппаратный watchdog для MPS2
        run: west build -b mps2/an385 -d build-watchdog . -o=-j4

      - name: Проверить зависание потока и аппаратный сброс
        run: python -m scripts.test_watchdog --elf build-watchdog/zephyr/zephyr.elf

      - name: Опубликовать отчёт тестов
        if: always()
        run: python scripts/ci_summary.py

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-test-results
          path: |
            twister-out/twister.json
            twister-out/twister*.xml
            twister-out/**/handler.log
            build/demo-test.log
            build/modbus-test.log
            build/modbus-scenario.log
            build/modbus-atomic.log
            build/modbus-motor.log
            build/modbus-motor-data.log
            build/motor-protections.log
            build/motor-shell.log
            build/motor-config-valid.log
            build/motor-config-invalid.log
            build/scenarios.log
            build/storage-test.log
            build-watchdog/watchdog-test.log
