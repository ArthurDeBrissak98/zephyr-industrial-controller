name: Zephyr Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install West
        run: |
          pip3 install --user -U west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Init Zephyr workspace (in separate folder)
        run: |
          cd ${{ github.workspace }}/..
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr main zephyr-workspace
          cd zephyr-workspace
          west update
          west zephyr-export

      - name: Install Zephyr SDK
        working-directory: ${{ github.workspace }}/../zephyr-workspace
        run: west sdk install --toolchains x86_64-zephyr-elf

      - name: Run Ztest via Twister
        working-directory: ${{ github.workspace }}/../zephyr-workspace
        run: |
          ./zephyr/scripts/twister -T ${{ github.workspace }}/tests -p native_sim