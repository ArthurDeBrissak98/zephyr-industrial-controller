name: Zephyr Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel python3-venv xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install West
        run: |
          python3 -m venv "$RUNNER_TEMP/zephyr-venv"
          "$RUNNER_TEMP/zephyr-venv/bin/pip" install west
          echo "$RUNNER_TEMP/zephyr-venv/bin" >> "$GITHUB_PATH"

      - name: Init Zephyr workspace (in separate folder)
        run: |
          cd ${{ github.workspace }}/..
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr main zephyr-workspace
          cd zephyr-workspace
          west update

      - name: Install Zephyr Python dependencies
        working-directory: ${{ github.workspace }}/../zephyr-workspace
        run: |
          python -m pip install -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt
          west zephyr-export

      - name: Run Ztest via Twister
        working-directory: ${{ github.workspace }}/../zephyr-workspace
        run: |
          ./zephyr/scripts/twister -T ${{ github.workspace }}/tests -p native_sim
